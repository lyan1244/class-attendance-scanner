<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Attendance Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --brand: #6b4eff;
      --brand-dark: #5538e0;
      --bg: #f7f5ff;
      --ink: #222;
      --line: #d9d4f0;
    }
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 20px 40px;
      background: var(--bg);
      color: var(--ink);
    }
    h1 { color: var(--brand); font-size: 24px; margin: 0; }
    h2 { font-size: 18px; margin: 0 0 4px; }
    p { margin: 0 0 12px; }
    .muted { color: #666; font-size: 14px; }

    input, select, button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
    }
    input, select { background: #fff; border: 1px solid var(--line); margin-bottom: 12px; }
    input:focus, select:focus, button:focus-visible {
      outline: 3px solid rgba(107, 78, 255, .35);
      outline-offset: 1px;
    }
    button { border: 0; background: var(--brand); color: #fff; cursor: pointer; }
    button:hover:not(:disabled) { background: var(--brand-dark); }
    button:disabled { background: #b5b5b5; cursor: not-allowed; }
    button.secondary {
      background: #fff; color: var(--brand); border: 1px solid var(--brand);
    }
    button.secondary:hover:not(:disabled) { background: #efebff; }
    button.secondary:disabled { color: #999; border-color: #ccc; background: #fff; }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 18px;
    }
    #logoutButton {
      width: auto; padding: 8px 14px; font-size: 14px;
      background: transparent; color: #666; border: 1px solid var(--line);
    }
    #logoutButton:hover { background: #fff; }

    .tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
      background: #e8e3ff; padding: 4px; border-radius: 12px; margin-bottom: 18px;
    }
    .tab {
      background: transparent; color: #4a3bb0; padding: 11px; font-weight: bold;
    }
    .tab:hover:not(:disabled) { background: rgba(255,255,255,.6); }
    .tab[aria-selected="true"] {
      background: #fff; color: var(--brand); box-shadow: 0 1px 3px rgba(0,0,0,.15);
    }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
    .btn-row button { margin: 0; }

    #reader { margin-top: 16px; border-radius: 12px; overflow: hidden; }
    #loginSection { text-align: center; }
    #message, #loginMessage, #studentMessage {
      margin-top: 14px; padding: 12px; border-radius: 10px;
      overflow-wrap: anywhere; text-align: center;
    }
    .info { background: #e8e3ff; }
    .error { background: #ffe0e0; }
    .success { background: #d9f7df; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Class Attendance 📚</h1>
    <button id="logoutButton" hidden>Log out</button>
  </div>

  <section id="loginSection">
    <p>Enter the coach access code to continue.</p>
    <form id="loginForm">
      <input type="password" id="accessCode" placeholder="Enter access code" required>
      <button type="submit" id="loginButton">Enter</button>
    </form>
    <div id="loginMessage" class="info" role="status">Please enter your access code.</div>
  </section>

  <section id="scannerSection" hidden>
    <div class="tabs" role="tablist">
      <button class="tab" id="tabScan" role="tab" aria-selected="true">Scan</button>
      <button class="tab" id="tabAdd" role="tab" aria-selected="false">Add student</button>
    </div>

    <!-- Scan tab -->
    <div id="scanPanel" role="tabpanel">
      <select id="classSelect" aria-label="Class time">
        <option value="">Select a class</option>
        <option value="10">10:00 AM</option>
        <option value="12">12:00 PM</option>
        <option value="4">4:00 PM</option>
        <option value="6">6:00 PM</option>
      </select>
      <div class="btn-row">
        <button id="startButton">Start scanning</button>
        <button id="stopButton" class="secondary" disabled>Stop camera</button>
      </div>
      <div id="reader"></div>
      <div id="message" class="info" role="status">Choose a class to get started.</div>
    </div>

    <!-- Add student tab -->
    <div id="addPanel" role="tabpanel" hidden>
      <h2>New student</h2>
      <p class="muted">The QR code is created in Google Sheets after saving.</p>
      <form id="addStudentForm">
        <input type="text" id="studentName" placeholder="Student full name in English" required>
        <input type="tel" id="studentPhone" placeholder="Student phone number" required>
        <div class="btn-row">
          <button type="submit" id="saveStudentButton">Save student</button>
          <button type="button" id="cancelAddStudentButton" class="secondary">Clear</button>
        </div>
      </form>
      <div id="studentMessage" class="info" role="status">Enter the student's information.</div>
    </div>
  </section>

  <script>
    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbxIxUR2u8Hn_14tUu1XyzaXTiM8vzjqkCB6IvbxX-QV1jmoB-ti-rre3C8aMi5Jzatb/exec";

    const loginForm = document.getElementById("loginForm");
    const accessCode = document.getElementById("accessCode");
    const loginButton = document.getElementById("loginButton");
    const loginSection = document.getElementById("loginSection");
    const scannerSection = document.getElementById("scannerSection");
    const loginMessage = document.getElementById("loginMessage");
    const classSelect = document.getElementById("classSelect");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");
    const logoutButton = document.getElementById("logoutButton");
    const message = document.getElementById("message");

    const tabScan = document.getElementById("tabScan");
    const tabAdd = document.getElementById("tabAdd");
    const scanPanel = document.getElementById("scanPanel");
    const addPanel = document.getElementById("addPanel");

    const addStudentForm = document.getElementById("addStudentForm");
    const studentName = document.getElementById("studentName");
    const studentPhone = document.getElementById("studentPhone");
    const saveStudentButton = document.getElementById("saveStudentButton");
    const cancelAddStudentButton = document.getElementById("cancelAddStudentButton");
    const studentMessage = document.getElementById("studentMessage");

    let scanner = null;
    let busy = false;
    let enteredCode = "";

    function showMessage(text, type = "info") {
      message.textContent = text;
      message.className = type;
    }

    function requestServer(params) {
      return new Promise((resolve, reject) => {
        const callback = "attendanceCallback";
        const query = new URLSearchParams({ ...params, callback });

        const script = document.createElement("script");
        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error("Request timed out. Check deployment and connection."));
        }, 15000);

        function cleanup() {
          clearTimeout(timeout);
          delete window[callback];
          script.remove();
        }

        window[callback] = (result) => { cleanup(); resolve(result); };
        script.onerror = () => {
          cleanup();
          reject(new Error("Could not reach the attendance server."));
        };

        script.src = WEB_APP_URL + "?" + query.toString();
        document.body.appendChild(script);
      });
    }

    /* ---------- Tabs ---------- */
    async function showTab(name) {
      const scanning = name === "scan";
      if (!scanning) await stopScanner();   // free the camera when leaving Scan
      scanPanel.hidden = !scanning;
      addPanel.hidden = scanning;
      tabScan.setAttribute("aria-selected", scanning);
      tabAdd.setAttribute("aria-selected", !scanning);
      if (!scanning) studentName.focus();
    }
    tabScan.addEventListener("click", () => showTab("scan"));
    tabAdd.addEventListener("click", () => showTab("add"));

    /* ---------- Login ---------- */
    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const code = accessCode.value.trim();
      if (!code) return;

      loginButton.disabled = true;
      loginMessage.textContent = "Verifying access code...";
      loginMessage.className = "info";

      try {
        const result = await requestServer({ action: "login", pin: code });

        if (!result.success) {
          loginMessage.textContent = result.message || "Access denied.";
          loginMessage.className = "error";
          return;
        }

        enteredCode = code;
        accessCode.value = "";
        loginSection.hidden = true;
        scannerSection.hidden = false;
        logoutButton.hidden = false;
        showTab("scan");
        showMessage("Choose a class to get started.", "info");
      } catch (error) {
        loginMessage.textContent = error.message;
        loginMessage.className = "error";
      } finally {
        loginButton.disabled = false;
      }
    });

    /* ---------- Scanner ---------- */
    startButton.addEventListener("click", async () => {
      if (!classSelect.value) {
        showMessage("Please select a class first.", "error");
        return;
      }
      if (scanner) return;

      try {
        scanner = new Html5Qrcode("reader");
        startButton.disabled = true;
        stopButton.disabled = false;
        showMessage("Requesting camera access...");

        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 230, height: 230 } },
          async (decodedText) => {
            if (busy) return;
            busy = true;
            showMessage("Checking QR code...", "info");

            try {
              const result = await requestServer({
                action: "scan",
                id: decodedText,
                classTime: classSelect.value,
                pin: enteredCode
              });

              if (result.success) {
                showMessage(
                  (result.name ? result.name + ": " : "") +
                  (result.message || "Attendance recorded!"),
                  "success"
                );
              } else {
                showMessage(result.message || "Attendance was not recorded.", "error");
              }
            } catch (error) {
              showMessage(error.message, "error");
            } finally {
              setTimeout(() => {
                busy = false;
                if (scanner) showMessage("Ready to scan the next QR code.", "info");
              }, 2000);
            }
          },
          () => {}
        );

        showMessage("Camera ready. Scan a student's QR code.");
      } catch (error) {
        scanner = null;
        startButton.disabled = false;
        stopButton.disabled = true;
        showMessage("Camera error: " + error, "error");
      }
    });

    async function stopScanner() {
      if (scanner) {
        try {
          await scanner.stop();
          await scanner.clear();
        } catch (error) {
          console.error(error);
        }
        scanner = null;
      }
      startButton.disabled = false;
      stopButton.disabled = true;
    }

    stopButton.addEventListener("click", async () => {
      await stopScanner();
      showMessage("Camera stopped.");
    });

    logoutButton.addEventListener("click", async () => {
      await stopScanner();
      enteredCode = "";
      classSelect.value = "";
      addStudentForm.reset();
      scannerSection.hidden = true;
      logoutButton.hidden = true;
      loginSection.hidden = false;
      loginMessage.textContent = "You have logged out.";
      loginMessage.className = "info";
    });

    /* ---------- Add student ---------- */
    cancelAddStudentButton.addEventListener("click", () => {
      addStudentForm.reset();
      studentMessage.textContent = "Enter the student's information.";
      studentMessage.className = "info";
      studentName.focus();
    });

    addStudentForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const name = studentName.value.trim();
      const phone = studentPhone.value.trim();

      if (!name || !phone) {
        studentMessage.textContent = "Please enter the name and phone number.";
        studentMessage.className = "error";
        return;
      }

      saveStudentButton.disabled = true;
      studentMessage.textContent = "Adding student...";
      studentMessage.className = "info";

      try {
        const result = await requestServer({
          action: "addStudent",
          pin: enteredCode,
          name: name,
          phone: phone
        });

        if (result.success) {
          studentMessage.textContent =
            result.name + " was added successfully! The QR code is available in Google Sheets.";
          studentMessage.className = "success";
          addStudentForm.reset();
          studentName.focus();
        } else {
          studentMessage.textContent = result.message || "Could not add student.";
          studentMessage.className = "error";
        }
      } catch (error) {
        studentMessage.textContent = error.message;
        studentMessage.className = "error";
      } finally {
        saveStudentButton.disabled = false;
      }
    });
  </script>
</body>
</html>
